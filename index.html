<!DOCTYPE html>
<html data-theme="light" lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport">
    <meta content="#1F2A44" name="theme-color">
    <meta content="Track your daily expenses, income and budgets. Works offline." name="description">
    <meta content="yes" name="apple-mobile-web-app-capable">
    <meta content="yes" name="mobile-web-app-capable">
    <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style">
    <meta content="Expenses" name="apple-mobile-web-app-title">
    <title>Expense Tracker</title>
    <link href="manifest.json" rel="manifest">
    <link href="icons/icon.svg" rel="icon" type="image/svg+xml">
    <link href="icons/icon-192.png" rel="apple-touch-icon">
    <link as="font" crossorigin href="fonts/bricolage.woff2" rel="preload" type="font/woff2">
    <link href="style.css" rel="stylesheet">
</head>
<body>

<!-- Top bar -->
<header class="topbar">
    <div class="topbar-inner">
        <h1 id="viewTitle">Dashboard</h1>
        <div class="period" id="periodBar">
            <button aria-label="Previous period" class="icon-btn" id="prevPeriod">
                <svg viewBox="0 0 24 24">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </button>
            <button class="period-label" id="periodLabel" title="Jump to current month">November 2026</button>
            <button aria-label="Next period" class="icon-btn" id="nextPeriod">
                <svg viewBox="0 0 24 24">
                    <path d="M9 6l6 6-6 6"/>
                </svg>
            </button>
        </div>
    </div>
</header>

<main id="app">
    <!-- Dashboard (rendered by JS) -->
    <section class="view" id="view-dashboard"></section>

    <!-- Expenses -->
    <section class="view" hidden id="view-expenses">
        <div class="toolbar card">
            <div class="search">
                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="M20 20l-3.5-3.5"/>
                </svg>
                <input autocomplete="off" id="expSearch" placeholder="Search description or notes" type="search">
            </div>
            <div class="toolbar-row">
                <select aria-label="Filter by category" class="input" id="expCat"></select>
                <select aria-label="Filter by payment method" class="input" id="expPay"></select>
            </div>
            <div class="toolbar-row2">
                <div class="segmented" id="expScope">
                    <button class="active" data-scope="month">This month</button>
                    <button data-scope="all">All time</button>
                </div>
                <select aria-label="Sort" class="input" id="expSort">
                    <option value="new">Newest</option>
                    <option value="old">Oldest</option>
                    <option value="high">Highest</option>
                    <option value="low">Lowest</option>
                </select>
            </div>
        </div>
        <div class="summary-line" id="expSummary"></div>
        <div id="expList"></div>
    </section>

    <!-- Income -->
    <section class="view" hidden id="view-income">
        <div class="toolbar card">
            <div class="search">
                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="M20 20l-3.5-3.5"/>
                </svg>
                <input autocomplete="off" id="incSearch" placeholder="Search description or notes" type="search">
            </div>
            <select aria-label="Filter by source" class="input" id="incSrc"></select>
            <div class="toolbar-row2">
                <div class="segmented" id="incScope">
                    <button class="active" data-scope="month">This month</button>
                    <button data-scope="all">All time</button>
                </div>
                <select aria-label="Sort" class="input" id="incSort">
                    <option value="new">Newest</option>
                    <option value="old">Oldest</option>
                    <option value="high">Highest</option>
                    <option value="low">Lowest</option>
                </select>
            </div>
        </div>
        <div class="summary-line" id="incSummary"></div>
        <div id="incList"></div>
    </section>

    <!-- Yearly summary (rendered by JS) -->
    <section class="view" hidden id="view-yearly"></section>

    <!-- Settings (rendered by JS) -->
    <section class="view" hidden id="view-settings"></section>
</main>

<!-- Add button -->
<button aria-label="Add entry" class="fab" id="fab">
    <svg viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14"/>
    </svg>
</button>

<!-- Bottom navigation -->
<nav aria-label="Main" class="tabbar">
    <button class="tab active" data-view="dashboard">
        <svg viewBox="0 0 24 24">
            <rect height="9" rx="2" width="7" x="3" y="3"/>
            <rect height="5" rx="2" width="7" x="14" y="3"/>
            <rect height="9" rx="2" width="7" x="14" y="12"/>
            <rect height="5" rx="2" width="7" x="3" y="16"/>
        </svg>
        <span>Home</span>
    </button>
    <button class="tab" data-view="expenses">
        <svg viewBox="0 0 24 24">
            <path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/>
            <path d="M9 8h6M9 12h6"/>
        </svg>
        <span>Expenses</span>
    </button>
    <button class="tab" data-view="income">
        <svg viewBox="0 0 24 24">
            <rect height="13" rx="2" width="20" x="2" y="6"/>
            <circle cx="12" cy="12.5" r="2.5"/>
            <path d="M6 6V4h12v2"/>
        </svg>
        <span>Income</span>
    </button>
    <button class="tab" data-view="yearly">
        <svg viewBox="0 0 24 24">
            <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
        </svg>
        <span>Year</span>
    </button>
    <button class="tab" data-view="settings">
        <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
        </svg>
        <span>Settings</span>
    </button>
</nav>

<!-- Add / edit sheet -->
<div class="modal" hidden id="modal">
    <div class="backdrop" data-close></div>
    <div aria-labelledby="formTitle" aria-modal="true" class="sheet" role="dialog">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
            <h2 id="formTitle">Add expense</h2>
            <button aria-label="Close" class="icon-btn" data-close>
                <svg viewBox="0 0 24 24">
                    <path d="M6 6l12 12M18 6L6 18"/>
                </svg>
            </button>
        </div>

        <div class="segmented" id="typeToggle">
            <button class="active" data-type="expense" type="button">Expense</button>
            <button data-type="income" type="button">Income</button>
        </div>

        <form id="txForm" novalidate>
            <label class="amount-field">
                <span id="curSym">Rs</span>
                <input aria-label="Amount" autocomplete="off" id="fAmt" inputmode="decimal" placeholder="0" type="text">
            </label>
            <div aria-label="Calculator" class="calc-bar" id="calcBar">
                <button aria-label="Plus" data-op="+" type="button">+</button>
                <button aria-label="Minus" data-op="-" type="button">−</button>
                <button aria-label="Times" data-op="*" type="button">×</button>
                <button aria-label="Divide" data-op="/" type="button">÷</button>
                <button aria-label="Work it out" class="eq" data-op="=" type="button">=</button>
            </div>
            <p class="hint" id="amtHint">Adding up a bill? Use + − × ÷</p>

            <div class="field" hidden id="quickField">
                <label>Quick add</label>
                <div class="quick" id="fQuick"></div>
            </div>

            <div class="field" id="catField">
                <label>Category</label>
                <div class="chip-grid" id="fCatChips"></div>
            </div>

            <div class="field-row">
                <div class="field">
                    <label for="fDate">Date</label>
                    <input class="input" id="fDate" type="date">
                </div>
                <div class="field" id="payField">
                    <label for="fPay">Paid with</label>
                    <select class="input" id="fPay"></select>
                </div>
                <div class="field" hidden id="srcField">
                    <label for="fSrc">Source</label>
                    <select class="input" id="fSrc"></select>
                </div>
            </div>

            <div class="field">
                <label for="fDesc">Description</label>
                <input autocomplete="off" class="input" id="fDesc" list="descList" maxlength="80"
                       placeholder="e.g. Momo with friends" type="text">
                <datalist id="descList"></datalist>
            </div>
            <div class="field" id="repeatField">
                <label>Repeat</label>
                <div class="segmented small" id="fRepeat">
                    <button class="active" data-r="none" type="button">Once</button>
                    <button data-r="weekly" type="button">Weekly</button>
                    <button data-r="monthly" type="button">Monthly</button>
                </div>
            </div>
            <div class="field">
                <label for="fNotes">Notes <span class="muted">(optional)</span></label>
                <input autocomplete="off" class="input" id="fNotes" maxlength="140" type="text">
            </div>

            <p class="form-error" id="formError" role="alert"></p>

            <div class="form-actions">
                <button class="btn danger" id="deleteTx" type="button">Delete</button>
                <button class="btn" id="dupTx" type="button">Duplicate</button>
                <button class="btn primary" id="saveTx" type="submit">Save</button>
            </div>
        </form>
    </div>
</div>

<!-- Generic dialog (goals, recurring) -->
<div class="modal" hidden id="dialog">
    <div class="backdrop" data-dclose></div>
    <div aria-labelledby="dTitle" aria-modal="true" class="sheet" role="dialog">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
            <h2 id="dTitle"></h2>
            <button aria-label="Close" class="icon-btn" data-dclose>
                <svg viewBox="0 0 24 24">
                    <path d="M6 6l12 12M18 6L6 18"/>
                </svg>
            </button>
        </div>
        <form id="dForm" novalidate>
            <div id="dBody"></div>
            <p class="form-error" id="dError" role="alert"></p>
            <div class="form-actions" id="dActions"></div>
        </form>
    </div>
</div>

<!-- PIN lock -->
<div class="lock" hidden id="lock">
    <div class="lock-inner">
        <div class="lock-icon">
            <svg viewBox="0 0 24 24">
                <rect height="10" rx="2" width="16" x="4" y="11"/>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
        </div>
        <h2 id="lockTitle">Enter PIN</h2>
        <div class="pin-dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
        <p class="lock-msg" id="lockMsg"></p>
        <div class="keypad" id="keypad">
            <button data-k="1">1</button>
            <button data-k="2">2</button>
            <button data-k="3">3</button>
            <button data-k="4">4</button>
            <button data-k="5">5</button>
            <button data-k="6">6</button>
            <button data-k="7">7</button>
            <button data-k="8">8</button>
            <button data-k="9">9</button>
            <button class="k-text" data-k="alt" id="lockAlt">Forgot?</button>
            <button data-k="0">0</button>
            <button aria-label="Delete" class="k-text" data-k="del">
                <svg viewBox="0 0 24 24">
                    <path d="M21 5H9l-6 7 6 7h12z"/>
                    <path d="M17 9l-6 6M11 9l6 6"/>
                </svg>
            </button>
        </div>
    </div>
</div>

<div aria-live="polite" class="toast" id="toast" role="status"></div>
<input accept="application/json,.json" hidden id="importFile" type="file">
<input accept=".csv,text/csv" hidden id="importCsv" type="file">

<script src="app.js"></script>
</body>
</html>
